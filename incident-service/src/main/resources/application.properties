spring.application.name=incident-service
server.port=8080

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/rca}
spring.datasource.username=${POSTGRES_USER:rca}
spring.datasource.password=${POSTGRES_PASSWORD:rca}

rca.queue-key=${RCA_QUEUE_KEY:rca:jobs:queue}
rca.sample-data-dir=${RCA_SAMPLE_DATA_DIR:../rca-service/sample_data/incidents}

springdoc.swagger-ui.path=/swagger-ui.html
# Liquibase changelog (master)
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
# Let Liquibase manage schema
spring.jpa.hibernate.ddl-auto=none

# Gemini embedding model (used by GeminiEmbeddingClient via RestClient)
# GOOGLE_API_KEY must be set in the environment
gemini.embedding.model=text-embedding-004
