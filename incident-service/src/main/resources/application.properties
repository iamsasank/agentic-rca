spring.application.name=incident-service
server.port=8080

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/rca}
spring.datasource.username=${POSTGRES_USER:rca}
spring.datasource.password=${POSTGRES_PASSWORD:rca}

rca.queue-key=${RCA_QUEUE_KEY:rca:jobs:queue}
rca.sample-data-dir=${RCA_SAMPLE_DATA_DIR:../rca-service/sample_data/incidents}

springdoc.swagger-ui.path=/swagger-ui.html
# Liquibase changelog (master)
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
# Let Liquibase manage schema
spring.jpa.hibernate.ddl-auto=none

# OpenAI — set OPENAI_API_KEY in environment
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.embedding.options.model=text-embedding-3-small

# Spring AI PgVectorStore — Liquibase owns DDL, so disable Spring AI schema init
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.table-name=rag_chunks
