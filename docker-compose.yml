services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rca
      POSTGRES_USER: rca
      POSTGRES_PASSWORD: rca
    ports:
      - "5432:5432"
    volumes:
      - rca-postgres:/var/lib/postgresql/data

volumes:
  rca-postgres:
